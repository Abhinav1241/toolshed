<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toolshed</title>
  <meta name="description" content="A workshop wall of free tools. Your files never leave your browser.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <a class="brand" href="#top" aria-label="Toolshed home">
      <img src="assets/favicon.svg" alt="" width="28" height="28">
      <span>Toolshed</span>
    </a>
    <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch theme">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <span>Theme</span>
    </button>
  </header>

  <main id="main">
    <section class="intro" id="top" aria-labelledby="site-title">
      <div class="intro-inner">
        <p class="stamp label">Free tools &middot; 15 drawers</p>
        <h1 class="title" id="site-title">Toolshed<span class="dot">.</span></h1>
        <p class="pitch">A workshop wall of small, sharp tools. Pick one off the pegboard, use it, hang it back. Your files never leave your browser.</p>
      </div>
      <p class="scroll-hint label">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M5 13l7 7 7-7"/></svg>
        Scroll
      </p>
    </section>
  </main>
</body>
</html>
