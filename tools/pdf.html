<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF merge &amp; split · Toolshed</title>
  <meta name="theme-color" content="#141517">
  <meta name="description" content="Merge PDFs, reorder, remove or extract pages in your browser. Your files never leave your device.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/tool.css">
  <link rel="stylesheet" href="../assets/css/site.css">
  <script src="../assets/js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <a class="brand" href="../index.html" aria-label="Toolshed home">
      <img src="../assets/favicon.svg" alt="" width="28" height="28">
      <span>Toolshed</span>
    </a>
    <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch theme">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <span>Theme</span>
    </button>
  </header>

  <main id="main" class="tool-page">
    <p class="label"><a class="crumb" href="../index.html#categories">&larr; The wall</a> &middot; PDF</p>
    <h1 class="tool-title">PDF merge &amp; split</h1>
    <p class="pitch">Join PDFs, drag pages into a new order, drop the ones you do not want, or keep just a few. Your files never leave your browser.</p>

    <label class="dropzone" data-drop>
      <input class="sr-only" type="file" accept="application/pdf,.pdf" multiple data-file>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
      <span class="drop-main">Drop PDFs here or <u>choose files</u></span>
      <span class="label">Add more files any time to merge them</span>
    </label>

    <p class="label" role="status" aria-live="polite" data-status>No pages yet</p>

    <div class="toolbar" data-toolbar hidden>
      <button class="btn btn-ghost" type="button" data-act="all">Select all</button>
      <button class="btn btn-ghost" type="button" data-act="none">Select none</button>
      <button class="btn btn-ghost" type="button" data-act="remove">Remove selected</button>
      <button class="btn btn-ghost" type="button" data-act="keep">Keep only selected</button>
      <button class="btn btn-ghost" type="button" data-act="clear">Clear all</button>
      <button class="btn" type="button" data-act="download">Download PDF</button>
    </div>

    <ol class="pages" data-pages aria-label="Pages in the output PDF, in order"></ol>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="label">Your files never leave your browser.</p>
      <nav class="footer-links" aria-label="Project">
        <a href="../index.html">All tools</a>
        <a href="https://github.com/YOUR-USER/toolshed">GitHub</a>
        <span>MIT licence</span>
      </nav>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="../assets/js/pdf-tool.js" defer></script>
</body>
</html>
