<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image resize &amp; compress · Toolshed</title>
  <meta name="description" content="Resize and compress images in your browser. Your files never leave your device.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/tool.css">
  <script src="../assets/js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <a class="brand" href="../index.html" aria-label="Toolshed home">
      <img src="../assets/favicon.svg" alt="" width="28" height="28">
      <span>Toolshed</span>
    </a>
    <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch theme">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <span>Theme</span>
    </button>
  </header>

  <main id="main" class="tool-page">
    <p class="label"><a class="crumb" href="../index.html#categories">&larr; The wall</a> &middot; Image</p>
    <h1 class="tool-title">Image resize &amp; compress</h1>
    <p class="pitch">Shrink photos by size or quality. Your files never leave your browser.</p>

    <label class="dropzone" data-drop>
      <input class="sr-only" type="file" accept="image/*" multiple data-file>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
      <span class="drop-main">Drop images here or <u>choose files</u></span>
      <span class="label">JPEG &middot; PNG &middot; WebP &middot; GIF &middot; BMP</span>
    </label>

    <form class="controls" data-controls onsubmit="return false">
      <fieldset>
        <legend class="label">Resize</legend>
        <div class="radio-row">
          <label><input type="radio" name="mode" value="fit" checked> Fit within size</label>
          <label><input type="radio" name="mode" value="percent"> Scale by percent</label>
        </div>
        <div class="field-row" data-mode-fit>
          <label class="field"><span class="label">Max width (px)</span><input type="number" name="maxW" min="1" max="16000" inputmode="numeric" placeholder="auto" value="1600"></label>
          <label class="field"><span class="label">Max height (px)</span><input type="number" name="maxH" min="1" max="16000" inputmode="numeric" placeholder="auto"></label>
          <label class="check"><input type="checkbox" name="noEnlarge" checked> Never enlarge</label>
        </div>
        <div class="field-row" data-mode-percent hidden>
          <label class="field"><span class="label">Scale (%)</span><input type="number" name="percent" min="1" max="400" inputmode="numeric" value="50"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend class="label">Output</legend>
        <div class="field-row">
          <label class="field"><span class="label">Format</span>
            <select name="format">
              <option value="same">Same as original</option>
              <option value="image/jpeg">JPEG</option>
              <option value="image/webp">WebP</option>
              <option value="image/png">PNG (lossless)</option>
            </select>
          </label>
          <label class="field field-wide"><span class="label">Quality: <output data-quality-out>80</output></span>
            <input type="range" name="quality" min="1" max="100" value="80">
          </label>
        </div>
        <p class="hint" data-quality-hint>Lower quality means a smaller file. PNG ignores this setting.</p>
      </fieldset>
    </form>

    <p class="label" role="status" aria-live="polite" data-status>No images yet</p>
    <ul class="results" data-results></ul>
  </main>

  <script src="../assets/js/image-tool.js" defer></script>
</body>
</html>
